        // Application State Holder
        let appState = {};
        let actionHistory = []; // For Undo functionality
        let activeModule = "Dashboard";
        let dateFilterRange = "This Month";
        let customDateFrom = "";
        let customDateTo = "";

        function initStorage() {
            const stored = localStorage.getItem("academy_os_db");
            if (stored) {
                try {
                    appState = JSON.parse(stored);
                } catch (e) {
                    console.error("Data parse error, fallback to demo data");
                    appState = JSON.parse(JSON.stringify(defaultData));
                    saveStorage();
                }
            } else {
                appState = JSON.parse(JSON.stringify(defaultData));
                saveStorage();
            }
        }

        function saveStorage(logActionName = null, logDetails = null) {
            localStorage.setItem("academy_os_db", JSON.stringify(appState));
            if (logActionName) {
                logActivity(logActionName, logDetails);
            }
        }

        function logActivity(action, details) {
            if (!appState.activityLogs) appState.activityLogs = [];
            appState.activityLogs.unshift({
                timestamp: new Date().toISOString(),
                user: "Admin",
                action: action,
                details: details || ""
            });
            // Keep max 200 logs
            if (appState.activityLogs.length > 200) appState.activityLogs.pop();
            localStorage.setItem("academy_os_db", JSON.stringify(appState));
        }

        function pushUndoState(actionDescription) {
            actionHistory.push({
                description: actionDescription,
                state: JSON.stringify(appState)
            });
            if (actionHistory.length > 15) actionHistory.shift();
        }

        function undoLastAction() {
            if (actionHistory.length === 0) {
                showToast("Nothing to undo", "info");
                return;
            }
            const previous = actionHistory.pop();
            appState = JSON.parse(previous.state);
            saveStorage();
            showToast(`Undone: ${previous.description}`, "success");
            renderPage(activeModule);
        }

        // Soft Delete Helper

            pushUndoState(`Delete item from ${collectionName}`);
            const index = appState[collectionName].findIndex(item => item.id === id);
            if (index !== -1) {
                const item = appState[collectionName].splice(index, 1)[0];
                if (!appState.recycleBin) appState.recycleBin = [];
                appState.recycleBin.push({
                    originalCollection: collectionName,
                    deletedAt: new Date().toISOString(),
                    item: item
                });

        // Date Formatter
        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
        }

        // Auto-increment ID Generator
        function generateId(prefix, collectionName) {
            const list = appState[collectionName] || [];
            let maxNum = 0;
            list.forEach(item => {
                if (item.id && item.id.startsWith(prefix)) {
                    const num = parseInt(item.id.split("-")[1], 10);
                    if (!isNaN(num) && num > maxNum) maxNum = num;
                }
            });
            return `${prefix}-${String(maxNum + 1).padStart(3, '0')}`;
        }

            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            
            const bgClass = type === "success" ? "bg-emerald-600 text-white" :
                            type === "error" ? "bg-red-600 text-white" :
                            type === "warning" ? "bg-amber-500 text-white" : "bg-slate-800 text-white";
                            
            toast.className = `px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);

        // Date Filter Range Evaluator
        function isDateInRange(dateString) {
            if (!dateString) return false;
            if (dateFilterRange === "All Time") return true;

            const target = new Date(dateString);
            target.setHours(0,0,0,0);
            const today = new Date();
            today.setHours(0,0,0,0);

            if (dateFilterRange === "Today") {
                return target.getTime() === today.getTime();
            } else if (dateFilterRange === "Yesterday") {
                const yest = new Date(today);
                yest.setDate(yest.getDate() - 1);
                return target.getTime() === yest.getTime();
            } else if (dateFilterRange === "Last 7 Days") {
                const past7 = new Date(today);
                past7.setDate(past7.getDate() - 7);
                return target >= past7 && target <= today;
            } else if (dateFilterRange === "Last 30 Days") {
                const past30 = new Date(today);
                past30.setDate(past30.getDate() - 30);
                return target >= past30 && target <= today;
            } else if (dateFilterRange === "This Month") {
                return target.getMonth() === today.getMonth() && target.getFullYear() === today.getFullYear();
            } else if (dateFilterRange === "Previous Month") {
                const prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                return target.getMonth() === prev.getMonth() && target.getFullYear() === prev.getFullYear();
            } else if (dateFilterRange === "Custom") {
                if (!customDateFrom && !customDateTo) return true;
                const from = customDateFrom ? new Date(customDateFrom) : new Date("2000-01-01");
                const to = customDateTo ? new Date(customDateTo) : new Date("2099-12-31");
                from.setHours(0,0,0,0);
                to.setHours(23,59,59,999);
                return target >= from && target <= to;
            }
            return true;
        }

        function renderTopOverdueStudents() {
            const todayStr = new Date().toISOString().split("T")[0];
            const overdueFees = appState.fees.filter(f => {
                const bal = Number(f.amount) - Number(f.paidAmount);
                return bal > 0 && f.dueDate && f.dueDate < todayStr;
            }).slice(0, 4);

            if (overdueFees.length === 0) {
                return `<p class="text-xs text-emerald-600 dark:text-emerald-400">Great! No overdue fee accounts present.</p>`;
            }

            return overdueFees.map(f => {
                const student = appState.students.find(s => s.id === f.studentId);
                const bal = Number(f.amount) - Number(f.paidAmount);
                if (!student) return "";
                
                const waMsg = encodeURIComponent(`Dear Parent, this is a reminder from ${appState.settings.academyName} regarding overdue fee for ${student.name} (${f.month}). Pending balance: ${formatCurrency(bal)}. Please clear at your earliest convenience.`);
                return `
                    <div class="bg-white dark:bg-slate-800 p-2.5 rounded-xl flex items-center justify-between border border-amber-100 dark:border-slate-700">
                        <div class="flex items-center gap-3 text-xs">

                            <span class="text-slate-400">(${student.id})</span>
                            <span class="text-rose-600 font-semibold">${formatCurrency(bal)} pending</span>
                        </div>
                        <a href="https://wa.me/${student.parentPhone || student.phone}?text=${waMsg}" target="_blank" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium flex items-center gap-1">

                `;
            }).join("");

        function saveStudent(e, studentId) {
            e.preventDefault();
            const batchId = document.getElementById("sf-batch").value;

            // Check capacity limit
            const batch = appState.batches.find(b => b.id === batchId);
            if (batch) {
                const enrolled = appState.students.filter(s => s.batchId === batchId && s.id !== studentId).length;
                if (enrolled >= batch.capacity) {
                    showToast(`Cannot enroll: Batch capacity limit reached (${batch.capacity})`, "error");
                    return;
                }
            }

            pushUndoState("Save Student Record");

            const data = {
                id: studentId || generateId("STU", "students"),
                name: document.getElementById("sf-name").value,
                fatherName: document.getElementById("sf-father").value,
                phone: document.getElementById("sf-phone").value,
                parentPhone: document.getElementById("sf-parent-phone").value,
                address: document.getElementById("sf-address").value,
                batchId: batchId,
                admissionDate: document.getElementById("sf-date").value,
                monthlyFee: parseFloat(document.getElementById("sf-fee").value) || 0,
                discount: parseFloat(document.getElementById("sf-discount").value) || 0,
                status: document.getElementById("sf-status").value,
                photo: ""
            };

            if (studentId) {
                const idx = appState.students.findIndex(s => s.id === studentId);
                if (idx !== -1) appState.students[idx] = data;
            } else {
                appState.students.push(data);
            }

            saveStorage("Save Student", `Saved student ${data.name} (${data.id})`);
            closeModal();
            showToast("Student profile saved successfully", "success");
            renderPage("Students");
        }

        function processMonthlyFeesGeneration() {
            const targetMonth = document.getElementById("gen-month").value;
            if (!targetMonth) return;

            pushUndoState("Generate Monthly Fees Batch");

            const activeStudents = appState.students.filter(s => s.status === "Active");
            let countGenerated = 0;
            const dueDay = appState.settings?.dueDay || 10;
            const dueDate = `${targetMonth}-${String(dueDay).padStart(2,'0')}`;

            activeStudents.forEach(stu => {
                const exists = appState.fees.some(f => f.studentId === stu.id && f.month === targetMonth);
                if (!exists) {
                    const payableFee = Math.max(0, stu.monthlyFee - stu.discount);
                    appState.fees.push({
                        id: generateId("FEE", "fees"),
                        studentId: stu.id,
                        month: targetMonth,
                        amount: payableFee,
                        paidAmount: 0,
                        dueDate: dueDate,
                        method: "Cash",
                        date: ""
                    });
                    countGenerated++;
                }
            });

            saveStorage("Generate Fees", `Generated ${countGenerated} fee records for ${targetMonth}`);
            closeModal();
            showToast(`Generated ${countGenerated} fee invoices for ${targetMonth}`, "success");
            renderPage("Fees");
        }

        function saveFee(e, feeId) {
            e.preventDefault();
            pushUndoState("Save Fee Record");

            const paidAmt = parseFloat(document.getElementById("ff-paid").value) || 0;
            const data = {
                id: feeId || generateId("FEE", "fees"),
                studentId: document.getElementById("ff-student") ? document.getElementById("ff-student").value : (appState.fees.find(f => f.id === feeId)?.studentId),
                month: document.getElementById("ff-month").value,
                dueDate: document.getElementById("ff-duedate").value,
                amount: parseFloat(document.getElementById("ff-amount").value) || 0,
                paidAmount: paidAmt,
                method: document.getElementById("ff-method").value,
                date: paidAmt > 0 ? document.getElementById("ff-date").value : ""
            };

            if (feeId) {
                const idx = appState.fees.findIndex(f => f.id === feeId);
                if (idx !== -1) appState.fees[idx] = data;
            } else {
                appState.fees.push(data);
            }

            saveStorage("Save Fee", `Saved fee invoice ${data.id}`);
            closeModal();
            showToast("Fee record saved", "success");
            renderPage("Fees");
        }

        function loadStudentsForAttendanceMarking(batchId) {
            const container = document.getElementById("att-students-list");
            if (!batchId) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4">Please choose a batch</p>`;
                return;
            }

            const students = appState.students.filter(s => s.batchId === batchId && s.status === "Active");
            if (students.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4">No active students in this batch</p>`;
                return;
            }

            container.innerHTML = `
                <div class="flex justify-between items-center mb-2 pb-2 border-b">
                    <span class="font-bold">Students (${students.length})</span>
                    <button type="button" onclick="markAllAttendanceStatus('Present')" class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-[10px] font-bold">Mark All Present</button>

                ${students.map(s => `
                    <div class="flex items-center justify-between p-2 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg border dark:border-slate-700">

                            <button type="button" onclick="setAttBtnStatus(this, 'Absent')" class="att-btn px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 rounded text-[10px] font-bold">A</button>
                            <button type="button" onclick="setAttBtnStatus(this, 'Late')" class="att-btn px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 rounded text-[10px] font-bold">L</button>
                        </div>
                    </div>
                `).join("")}
            `;
        }

        function setAttBtnStatus(btn, status) {
            const group = btn.closest(".att-radio-group");
            group.querySelectorAll(".att-btn").forEach(b => {
                b.className = "att-btn px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 rounded text-[10px] font-bold";
            });
            if (status === 'Present') btn.className = "att-btn px-2.5 py-1 bg-emerald-600 text-white rounded text-[10px] font-bold";
            if (status === 'Absent') btn.className = "att-btn px-2.5 py-1 bg-rose-600 text-white rounded text-[10px] font-bold";
            if (status === 'Late') btn.className = "att-btn px-2.5 py-1 bg-amber-500 text-white rounded text-[10px] font-bold";
            group.dataset.selectedStatus = status;
        }

        function markAllAttendanceStatus(status) {
            document.querySelectorAll(".att-radio-group").forEach(group => {
                const btn = group.querySelector(status === 'Present' ? "button:nth-child(1)" : status === 'Absent' ? "button:nth-child(2)" : "button:nth-child(3)");
                if (btn) setAttBtnStatus(btn, status);
            });
        }

        function saveBulkAttendance() {
            const batchId = document.getElementById("att-batch-select").value;
            if (!batchId) return;

            pushUndoState("Save Attendance Batch");
            const todayStr = new Date().toISOString().split("T")[0];
            let countSaved = 0;

            document.querySelectorAll(".att-radio-group").forEach(group => {
                const studentId = group.dataset.studentId;
                const status = group.dataset.selectedStatus || "Present";

                // Remove duplicate entry for same date and student if exists
                appState.attendance = appState.attendance.filter(a => !(a.date === todayStr && a.studentId === studentId));

                appState.attendance.push({
                    id: generateId("ATT", "attendance"),
                    date: todayStr,
                    studentId: studentId,
                    batchId: batchId,
                    status: status,
                    remarks: ""
                });
                countSaved++;
            });

            saveStorage("Mark Attendance", `Marked ${countSaved} attendance entries for batch ${batchId}`);
            closeModal();
            showToast("Attendance logged successfully", "success");
            renderPage("Attendance");
        }

            const test = appState.tests.find(t => t.id === testId);

            const students = appState.students.filter(s => s.batchId === test.batchId && s.status === "Active");

            const html = `

                            return `

        function saveTestMarks(testId) {
            if (!appState.marks) appState.marks = [];
            pushUndoState("Save Test Marks");

            document.querySelectorAll(".mark-input").forEach(input => {
                const stuId = input.dataset.studentId;
                const val = parseFloat(input.value) || 0;

                appState.marks = appState.marks.filter(m => !(m.testId === testId && m.studentId === stuId));
                appState.marks.push({
                    testId: testId,
                    studentId: stuId,
                    obtainedMarks: val
                });
            });

            saveStorage("Save Marks", `Saved result marks for test ${testId}`);
            closeModal();
            showToast("Test marks saved", "success");
        }

        function viewTestResults(testId) {
            const test = appState.tests.find(t => t.id === testId);
            if (!test) return;
            const students = appState.students.filter(s => s.batchId === test.batchId);

            let rankList = students.map(s => {
                const markObj = (appState.marks || []).find(m => m.testId === testId && m.studentId === s.id);
                const obtained = markObj ? markObj.obtainedMarks : 0;
                const pct = ((obtained / test.totalMarks) * 100).toFixed(1);
                
                let grade = "F";
                if (pct >= 80) grade = "A+";
                else if (pct >= 70) grade = "A";
                else if (pct >= 60) grade = "B";
                else if (pct >= 50) grade = "C";

                return { student: s, obtained, pct, grade };
            });

            rankList.sort((a, b) => b.obtained - a.obtained);

            const html = `
                <div class="text-center p-2">
                    <div id="test-result-print" class="p-4 text-left">
                        <h3 class="font-bold text-base text-slate-800 dark:text-white">${test.name} - Result Sheet</h3>
                        <p class="text-xs text-slate-500 mb-4">Date: ${test.date} | Total Marks: ${test.totalMarks}</p>

                                    <th class="p-2 border">Student</th>
                                    <th class="p-2 border text-center">Obtained</th>
                                    <th class="p-2 border text-center">%</th>
                                    <th class="p-2 border text-center">Grade</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rankList.map((item, idx) => `
                                    <tr>
                                        <td class="p-2 border text-center font-bold">${idx + 1}</td>
                                        <td class="p-2 border font-semibold">${item.student.name}</td>
                                        <td class="p-2 border text-center font-bold">${item.obtained}</td>
                                        <td class="p-2 border text-center">${item.pct}%</td>
                                        <td class="p-2 border text-center font-bold ${item.grade === 'F' ? 'text-rose-600' : 'text-emerald-600'}">${item.grade}</td>
                                    </tr>
                                `).join("")}

                    <button onclick="printDiv('test-result-print')" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-medium">Print Result Sheet</button>
                </div>
            `;
            openModal("Test Ranking Sheet", html);
        }

        function applyWATemplate(type) {
            const txtArea = document.getElementById("wa-msg-text");
            if (type === "fee") {
                txtArea.value = `Dear Parent, this is a friendly reminder from ${appState.settings.academyName} that fee for {student} is due. Please submit at your earliest convenience.`;
            } else if (type === "absence") {
                txtArea.value = `Dear Parent, your child {student} was absent from class today at ${appState.settings.academyName}. Kindly inform us of the reason.`;
            } else if (type === "announcement") {
                txtArea.value = `Dear Parents and Students, please note that ${appState.settings.academyName} will remain closed on upcoming official holiday. Regular classes resume thereafter.`;
            }
        }

        function startWhatsAppBroadcast() {
            const textTemplate = document.getElementById("wa-msg-text").value;
            const target = document.getElementById("wa-target-select").value;
            const container = document.getElementById("wa-queue-list");

            let targetStudents = appState.students.filter(s => s.status === "Active");
            if (target === "overdue") {
                const todayStr = new Date().toISOString().split("T")[0];
                const overdueIds = appState.fees.filter(f => (f.amount - f.paidAmount) > 0 && f.dueDate < todayStr).map(f => f.studentId);
                targetStudents = targetStudents.filter(s => overdueIds.includes(s.id));
            }

            if (targetStudents.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4">No recipients matching target criteria</p>`;
                return;
            }

            container.innerHTML = targetStudents.map(s => {
                const finalMsg = encodeURIComponent(textTemplate.replace("{student}", s.name));
                return `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl border dark:border-slate-700">
                        <div>
                            <p class="font-bold text-slate-800 dark:text-white">${s.name}</p>
                            <p class="text-[10px] text-slate-400">${s.phone}</p>
                        </div>
                        <a href="https://wa.me/${s.phone}?text=${finalMsg}" target="_blank" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg font-semibold text-[11px] flex items-center gap-1">
                            <i class="fa-brands fa-whatsapp"></i> Send
                        </a>
                    </div>
                `;
            }).join("");
        }

                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-900/50 border-b border-slate-200 dark:border-slate-700 text-[11px] uppercase tracking-wider text-slate-400 font-bold">
                                <th class="py-3.5 px-4">Deleted Date</th>
                                <th class="py-3.5 px-4">Collection</th>
                                <th class="py-3.5 px-4">Record Item ID</th>
                                <th class="py-3.5 px-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 dark:divide-slate-700/50 text-xs">
                            ${bin.length === 0 ? `<tr><td colspan="4" class="text-center py-6 text-slate-400">Recycle Bin is empty</td></tr>` : 
                            bin.map((item, idx) => `
                                <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                                    <td class="py-3 px-4 text-slate-400">${new Date(item.deletedAt).toLocaleString()}</td>
                                    <td class="py-3 px-4 uppercase font-bold text-indigo-600">${item.originalCollection}</td>
                                    <td class="py-3 px-4 font-semibold text-slate-800 dark:text-white">${item.item.id || item.item.name || 'Record'}</td>
                                    <td class="py-3 px-4 text-right space-x-1">
                                        <button onclick="restoreRecycleBinItem(${idx})" class="px-2.5 py-1 bg-emerald-600 text-white rounded-lg text-[11px]">Restore</button>
                                        <button onclick="permanentlyDeleteBinItem(${idx})" class="px-2.5 py-1 bg-rose-600 text-white rounded-lg text-[11px]">Delete</button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function restoreRecycleBinItem(index) {
            const target = appState.recycleBin[index];
            if (!target) return;

            pushUndoState("Restore Deleted Record");
            appState[target.originalCollection].push(target.item);
            appState.recycleBin.splice(index, 1);
            saveStorage("Restore Item", `Restored item ${target.item.id || ''}`);
            showToast("Record restored", "success");
            renderPage("RecycleBin");
        }

        function permanentlyDeleteBinItem(index) {
            appState.recycleBin.splice(index, 1);
            saveStorage("Permanent Delete", "Permanently removed record");
            showToast("Record permanently wiped", "info");
            renderPage("RecycleBin");
        }

        function emptyRecycleBin() {
            appState.recycleBin = [];
            saveStorage("Empty Recycle Bin", "Wiped all items in recycle bin");
            showToast("Recycle bin cleared", "info");
            renderPage("RecycleBin");
        }

        function renderSettingsModule() {
            const set = appState.settings || {};
            return `
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Academy Settings</h2>
                        <p class="text-xs text-slate-500">System configuration & branding</p>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm max-w-2xl space-y-4 text-xs">
                    <form onsubmit="saveSettings(event)" class="space-y-4">
                        <div>
                            <label class="block font-semibold mb-1">Academy Name *</label>
                            <input type="text" id="set-name" required value="${set.academyName || ''}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold mb-1">Contact Phone</label>
                                <input type="text" id="set-phone" value="${set.phone || ''}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1">Currency Code</label>
                                <input type="text" id="set-currency" value="${set.currency || 'PKR'}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            </div>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">Campus Address</label>
                            <input type="text" id="set-address" value="${set.address || ''}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold mb-1">System Security PIN Code</label>
                                <input type="password" id="set-pin" maxlength="6" value="${set.pin || '1234'}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            </div>
                            <div>
                                <label class="block font-semibold mb-1">Default Fee Due Day of Month</label>
                                <input type="number" id="set-dueday" min="1" max="28" value="${set.dueDay || 10}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                            </div>
                        </div>
                        <div>
                            <label class="block font-semibold mb-1">Receipt Footer Note</label>
                            <input type="text" id="set-footer" value="${set.receiptFooter || ''}" class="w-full px-3 py-2 border rounded-xl dark:bg-slate-900 dark:border-slate-700">
                        </div>
                        <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold">Save Academy Settings</button>
                    </form>
                </div>
            `;
        }

        function saveSettings(e) {
            e.preventDefault();
            appState.settings = {
                ...appState.settings,
                academyName: document.getElementById("set-name").value,
                phone: document.getElementById("set-phone").value,
                currency: document.getElementById("set-currency").value,
                address: document.getElementById("set-address").value,
                pin: document.getElementById("set-pin").value,
                dueDay: parseInt(document.getElementById("set-dueday").value, 10) || 10,
                receiptFooter: document.getElementById("set-footer").value
            };
            saveStorage("Update Settings", "Saved academy system configuration");
            renderSidebar();
            showToast("Settings updated successfully", "success");
        }

        function renderBackupModule() {
            return `
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 dark:text-white">Backup & Database Restore</h2>
                        <p class="text-xs text-slate-500">Manage database backups & local file downloads</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-3">
                        <i class="fa-solid fa-download text-2xl text-indigo-600"></i>
                        <h3 class="font-bold text-sm text-slate-800 dark:text-white">Export Database</h3>
                        <p class="text-xs text-slate-500">Download a complete JSON snapshot of all records to safe storage.</p>
                        <button onclick="downloadBackupJSON()" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Export Backup JSON</button>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-3">
                        <i class="fa-solid fa-upload text-2xl text-emerald-600"></i>
                        <h3 class="font-bold text-sm text-slate-800 dark:text-white">Restore Database</h3>
                        <p class="text-xs text-slate-500">Import a previously saved JSON database backup file into the browser.</p>
                        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importBackupJSON(event)">
                        <button onclick="document.getElementById('import-file').click()" class="w-full py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">Restore JSON File</button>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-3">
                        <i class="fa-solid fa-rotate-right text-2xl text-rose-600"></i>
                        <h3 class="font-bold text-sm text-slate-800 dark:text-white">Reset Demo Data</h3>
                        <p class="text-xs text-slate-500">Wipe current state and reload initial factory default Pakistani sample data.</p>
                        <button onclick="resetFactoryDemoData()" class="w-full py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold">Reset Demo Data</button>
                    </div>
                </div>
            `;
        }

        function downloadBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `Academy_OS_Backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast("Backup file downloaded", "success");
        }

        function importBackupJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    appState = parsed;
                    saveStorage("Import Backup", "Restored database from external JSON file");
                    showToast("Database restored successfully", "success");
                    renderPage(activeModule);
                } catch (err) {
                    showToast("Invalid JSON file format", "error");
                }
            };
            reader.readAsText(file);
        }

        function resetFactoryDemoData() {
            if (confirm("Are you sure you want to reset all records to default demo data?")) {
                appState = JSON.parse(JSON.stringify(defaultData));
                saveStorage("Reset Demo Data", "Factory reset system database");
                showToast("Demo data reloaded", "info");
                renderPage(activeModule);
            }
        }

        function exportCSV(type) {
            let data = [];
            if (type === 'students') data = appState.students;
            if (data.length === 0) return;

            const headers = Object.keys(data[0]).join(",");
            const rows = data.map(obj => Object.values(obj).map(v => `"${v}"`).join(","));
            const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${type}_report.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        // Master Page Router
        function renderPage(moduleId) {
            const content = document.getElementById("page-content");
            if (moduleId === "Dashboard") content.innerHTML = renderDashboard();
            else if (moduleId === "Students") content.innerHTML = renderStudentsModule();
            else if (moduleId === "Teachers") content.innerHTML = renderTeachersModule();
            else if (moduleId === "Courses") content.innerHTML = renderCoursesModule();
            else if (moduleId === "Batches") content.innerHTML = renderBatchesModule();
            else if (moduleId === "Fees") content.innerHTML = renderFeesModule();
            else if (moduleId === "Attendance") content.innerHTML = renderAttendanceModule();
            else if (moduleId === "Expenses") content.innerHTML = renderExpensesModule();
            else if (moduleId === "Tests") content.innerHTML = renderTestsModule();
            else if (moduleId === "Timetable") content.innerHTML = renderTimetableModule();
            else if (moduleId === "Salary") content.innerHTML = renderSalaryModule();
            else if (moduleId === "WhatsApp") content.innerHTML = renderWhatsAppModule();
            else if (moduleId === "ActivityLog") content.innerHTML = renderActivityLogModule();
            else if (moduleId === "RecycleBin") content.innerHTML = renderRecycleBinModule();
            else if (moduleId === "Settings") content.innerHTML = renderSettingsModule();
            else if (moduleId === "Backup") content.innerHTML = renderBackupModule();
            else content.innerHTML = `<h2 class="text-xl font-bold">Module Under Construction</h2>`;
        }

        // Initialize Application on Window Load
        window.onload = function() {
            initStorage();
            renderSidebar();
            renderPage("Dashboard");
        };
    </script>
</body>
</html>
